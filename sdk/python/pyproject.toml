[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grok-box"
version = "0.1.0"
description = "Connect-only Python client for a grok-box guest. Not published to PyPI."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Uriah" }]
dependencies = ["httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]
