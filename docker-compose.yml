services:
  box:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: grok-box:local
    # Hardening is not a kernel sandbox. Unprivileged uid 1000 + Chromium
    # --no-sandbox. These limits reduce blast radius; they do not isolate the
    # guest from the host kernel.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 1024
    mem_limit: 4g
    shm_size: "256mb"
    # Secrets arrive as mounted files, not as environment values. A value in
    # `environment:` lands in pid 1's environ block, which /proc/1/environ
    # serves to every process in the box for the life of the box, and in
    # `docker inspect` on the host. Run `bash scripts/write-secrets.sh` first.
    secrets:
      - box_token
      - box_vnc_password
    environment:
      BOX_TOKEN_FILE: /run/secrets/box_token
      BOX_VNC_PASSWORD_FILE: /run/secrets/box_vnc_password
      BOX_ID: ${BOX_ID:-local-dev}
      RUST_LOG: ${RUST_LOG:-info}
      WORKSPACE_ROOT: /workspace
      BOX_DESKTOP: ${BOX_DESKTOP:-1}
      BOX_DESKTOP_REQUIRED: ${BOX_DESKTOP_REQUIRED:-1}
      BOX_DISPLAY: ${BOX_DISPLAY:-:1}
      BOX_DISPLAY_GEOM: ${BOX_DISPLAY_GEOM:-1280x800x24}
      BOX_VNC_BIND: ${BOX_VNC_BIND:-127.0.0.1:5900}
      BOX_NOVNC_PORT: ${BOX_NOVNC_PORT:-6080}
      BOX_CHROME: ${BOX_CHROME:-1}
      BOX_CHROME_PROFILE: /home/box/chrome-profile
      BOX_CDP_PORT: ${BOX_CDP_PORT:-9222}
      BOX_CUA: ${BOX_CUA:-1}
      BOX_EXEC_BIND: 0.0.0.0:1337
      BOX_HOST_BIND: 0.0.0.0:1340
      BOX_MAX_CONCURRENT_EXECS: ${BOX_MAX_CONCURRENT_EXECS:-8}
      # Off by default. See docs/EGRESS.md. Never publish the CONNECT proxy (8791).
      BOX_EGRESS_TUNNEL: ${BOX_EGRESS_TUNNEL:-0}
      BOX_EGRESS_WS_BIND: ${BOX_EGRESS_WS_BIND:-0.0.0.0:8790}
      BOX_EGRESS_PROXY_BIND: ${BOX_EGRESS_PROXY_BIND:-127.0.0.1:8791}
      BOX_EGRESS_ADMIN_BIND: ${BOX_EGRESS_ADMIN_BIND:-127.0.0.1:8792}
      BOX_EGRESS_TUNNEL_BEARER_FILE: ${BOX_EGRESS_TUNNEL_BEARER_FILE:-}
      BOX_EGRESS_RELAY_HOSTS: ${BOX_EGRESS_RELAY_HOSTS:-}
    ports:
      - "127.0.0.1:1337:1337"
      - "127.0.0.1:1340:1340"
      - "127.0.0.1:6080:6080"
      - "127.0.0.1:8790:8790"
    volumes:
      - ./workspace-data:/workspace
      - ./chrome-profile:/home/box/chrome-profile
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS -H \"Authorization: Bearer $$(cat /run/secrets/box_token)\" http://127.0.0.1:1340/v1/ready",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 25s

# Compose mounts these read-only at /run/secrets/<name>. The mount stays
# readable by uid 1000 inside the container — that is what lets the healthcheck
# authenticate — so this hides the token from /proc and from `docker inspect`,
# not from code already running as the box user. See README §Auth.
secrets:
  box_token:
    file: ./secrets/box_token
  box_vnc_password:
    file: ./secrets/box_vnc_password
