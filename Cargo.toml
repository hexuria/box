[workspace]
resolver = "2"
members = [
    "crates/box-common",
    "crates/box-exec",
    "crates/box-host",
    "crates/box-desktop",
    "crates/box-chrome",
    "crates/box-cua",
    "crates/grok-box",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Uriah"]
description = "Sandboxed Linux computer for agents (grok-box guest image, CLI, and SDKs)"
repository = "https://github.com/hexuria/box"
rust-version = "1.85"

[workspace.dependencies]
box-common = { path = "crates/box-common" }
box-desktop = { path = "crates/box-desktop" }
box-chrome = { path = "crates/box-chrome" }
box-cua = { path = "crates/box-cua" }
axum = { version = "0.8", features = ["json", "macros"] }
base64 = "0.22"
tokio = { version = "1.43", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "limit", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
thiserror = "2.0"
http = "1"
bytes = "1"
subtle = "2.6"
http-body-util = "0.1"
tempfile = "3"
libc = "0.2"
clap = { version = "4.5", features = ["derive", "env"] }
anyhow = "1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
