[package]
name = "box-cua"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Computer Use actuators against the box X display"
rust-version.workspace = true
publish = false

[dependencies]
box-desktop = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
base64 = { workspace = true }
tracing = { workspace = true }
x11rb = { workspace = true }
png = { workspace = true }
smallvec = { workspace = true }
arrayvec = { workspace = true }
# Optional so `cargo bench -p box-cua --features mimalloc` matches the guest
# #[global_allocator]. The library does not install an allocator; box-exec does.
mimalloc = { workspace = true, optional = true }

[features]
default = []
mimalloc = ["dep:mimalloc"]

[dev-dependencies]
serde_json = { workspace = true }
tokio = { workspace = true }
criterion = { workspace = true }
bumpalo = { version = "3.16", features = ["collections"] }

[[bench]]
name = "hotpath"
harness = false
