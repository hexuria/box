openapi: 3.1.0
info:
  title: grok-box
  description: |
    Guest HTTP wire for grok-box. Two processes share this document:
    box-exec (port 1337: exec, files, CUA) and box-host (port 1340: identity,
    readiness, desktop/chrome/egress status). Neither service performs model inference.
    CUA coordinate space is the X framebuffer 1280x800, origin top-left.
    SDKs connect with caller-supplied exec URL, host URL, and token; they ignore
    /v1/info advertised URLs (those are container-local listen addresses).
    CUA coordinate bounds follow BOX_DISPLAY_GEOM (default 1280x800). Responses
    echo x-request-id. Exec is HTTP-only on the guest; TLS belongs at a reverse
    proxy. The Rust/TS/Python clients speak HTTP or HTTPS.
  version: 0.1.0
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://127.0.0.1:1337
    description: box-exec (Compose)
  - url: http://127.0.0.1:1340
    description: box-host (Compose)

tags:
  - name: exec
    description: box-exec — commands and workspace files
  - name: cua
    description: box-exec — Computer Use against DISPLAY=:1 (1280x800)
  - name: host
    description: box-host — identity and readiness
  - name: desktop
    description: box-host — virtual desktop and Chromium status

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
  parameters:
    RequestId:
      in: header
      name: x-request-id
      required: false
      schema: { type: string, maxLength: 128 }
      description: Optional correlation id. Echoed on the response; minted if omitted.
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, status]
          properties:
            code: { type: string, examples: [unauthorized, path_escape] }
            message: { type: string }
            status: { type: integer }
    Health:
      type: object
      required: [status]
      properties:
        status: { type: string, examples: [ok] }
    ExecRequest:
      type: object
      required: [command]
      properties:
        command:
          oneOf:
            - type: array
              items: { type: string }
              minItems: 1
            - type: string
              minLength: 1
        cwd: { type: string, description: Relative or absolute path inside the workspace jail }
        timeout_ms: { type: integer, minimum: 1 }
        env:
          type: object
          additionalProperties: { type: string }
        stdin: { type: string, nullable: true }
        detach: { type: boolean, default: false }
        pty: { type: boolean, description: "Not implemented. Returns 400. Use /v1/exec/stream." }
    ExecResponse:
      type: object
      required:
        [stdout, stderr, timed_out, duration_ms, truncated, output_complete, cwd]
      properties:
        stdout: { type: string }
        stderr: { type: string }
        exit_code: { type: integer, nullable: true }
        timed_out: { type: boolean }
        duration_ms: { type: integer }
        truncated:
          type: boolean
          description: >-
            The returned output is not everything the command produced: either
            BOX_MAX_OUTPUT_BYTES was hit, or reading stopped before EOF
            (output_complete false).
        output_complete:
          type: boolean
          description: >-
            Both pipes reached EOF before the response was built. False means a
            process the command left running still holds them, so anything
            written after the foreground exited was not captured. Use
            detach=true or /v1/exec/stream for output that outlives the request.
        cwd: { type: string }
        exec_id: { type: string }
        detached: { type: boolean }
        status: { type: string, nullable: true }
    ExecCancelResponse:
      type: object
      required: [exec_id, cancelled]
      properties:
        exec_id: { type: string }
        cancelled:
          type: boolean
          description: False when the id is known but the exec had already finished.
    ExecStreamEvent:
      type: object
      properties:
        type: { type: string, enum: [stdout, stderr, exit] }
        data: { type: string }
        exec_id: { type: string }
        exit_code: { type: integer, nullable: true }
        timed_out: { type: boolean }
        duration_ms: { type: integer }
        truncated: { type: boolean }
        output_complete: { type: boolean }
        cwd: { type: string }
    FileGet:
      oneOf:
        - type: object
          required: [kind, path, size, encoding, content]
          properties:
            kind: { type: string, enum: [file] }
            path: { type: string }
            size: { type: integer }
            encoding: { type: string, enum: [utf8, base64] }
            content: { type: string }
        - type: object
          required: [kind, path, entries]
          properties:
            kind: { type: string, enum: [directory] }
            path: { type: string }
            entries:
              type: array
              items:
                type: object
                required: [name, kind]
                properties:
                  name: { type: string }
                  kind: { type: string }
                  size: { type: integer, nullable: true }
            truncated: { type: boolean }
    FilePutRequest:
      type: object
      required: [path, content]
      properties:
        path: { type: string }
        content: { type: string }
        encoding: { type: string, enum: [utf8, text, base64], default: utf8 }
        create_dirs: { type: boolean, default: true }
    FilePutResponse:
      type: object
      required: [path, bytes_written]
      properties:
        path: { type: string }
        bytes_written: { type: integer }
    FileDeleteResponse:
      type: object
      required: [path, deleted]
      properties:
        path: { type: string }
        deleted: { type: boolean }
    MkdirRequest:
      type: object
      required: [path]
      properties:
        path: { type: string }
        parents: { type: boolean, default: true }
    MkdirResponse:
      type: object
      required: [path, created]
      properties:
        path: { type: string }
        created: { type: boolean }
    Ready:
      type: object
      required: [status, service, exec_ready, desktop_ready]
      properties:
        status: { type: string }
        service: { type: string }
        exec_ready: { type: boolean }
        desktop_ready: { type: boolean }
    DesktopStatus:
      type: object
      required: [enabled, ready, available, display, geometry, vnc, viewer]
      properties:
        enabled: { type: boolean }
        ready: { type: boolean }
        available: { type: boolean, description: Same as ready (compat) }
        display: { type: string }
        geometry: { type: string }
        vnc: { type: string }
        viewer:
          type: object
          properties:
            port: { type: integer }
            path: { type: string }
            url: { type: string }
    ChromeStatus:
      type: object
      required: [enabled, ready, running, profile, display]
      properties:
        enabled: { type: boolean }
        ready: { type: boolean, description: CDP GET /json/version succeeded }
        running: { type: boolean }
        profile: { type: string }
        cdp: { type: string, nullable: true }
        display: { type: string }
    EgressStatus:
      type: object
      required: [enabled, ready, client_attached, protocol, ws, proxy]
      properties:
        enabled: { type: boolean }
        ready:
          type: boolean
          description: A laptop client is attached; Chromium CONNECT is relayed
        client_attached: { type: boolean }
        protocol: { type: string, examples: [box-egress-v1] }
        ws:
          type: string
          description: Container-local WS listen inventory, not a public connect URL
        proxy:
          type: string
          description: Container-local CONNECT proxy (always loopback; never publish)
    Screenshot:
      type: object
      required: [encoding, mime, width, height, png_base64, bytes]
      properties:
        encoding: { type: string, examples: [base64] }
        mime: { type: string, examples: [image/png] }
        width: { type: integer, examples: [1280] }
        height: { type: integer, examples: [800] }
        bytes: { type: integer }
        png_base64: { type: string }
    ClickRequest:
      type: object
      required: [x, y]
      properties:
        x: { type: integer, minimum: 0, maximum: 1279 }
        y: { type: integer, minimum: 0, maximum: 799 }
        button: { type: integer, minimum: 1, maximum: 7, default: 1 }
    TypeRequest:
      type: object
      required: [text]
      properties:
        text: { type: string, minLength: 1 }
    KeyRequest:
      type: object
      required: [key]
      properties:
        key: { type: string, minLength: 1 }
        action: { type: string, enum: [tap, down, up], default: tap }
    PressRequest:
      type: object
      required: [x, y]
      properties:
        x: { type: integer }
        y: { type: integer }
        button: { type: integer, minimum: 1, maximum: 7, default: 1 }
    ReleaseRequest:
      type: object
      properties:
        x: { type: integer }
        y: { type: integer }
        button: { type: integer, minimum: 1, maximum: 7, default: 1 }
        path:
          type: array
          maxItems: 64
          items:
            type: object
            required: [x, y]
            properties:
              x: { type: integer }
              y: { type: integer }
    Busy:
      type: object
      properties:
        busy: { type: boolean }
        execs:
          type: object
          properties:
            current: { type: integer }
            max: { type: integer }
        shutting_down: { type: boolean }
        exec_ready: { type: boolean }
        desktop_ready: { type: boolean }
        chrome_ready: { type: boolean }
    Metrics:
      type: object
      properties:
        service: { type: string }
        uptime_ms: { type: integer }
        open_fds:
          type: integer
          nullable: true
          description: >-
            Descriptors this process has open, or null where the platform
            cannot report them.
        execs:
          type: object
          properties:
            current: { type: integer }
            max: { type: integer }
            started: { type: integer }
            child_groups:
              type: integer
              description: Child process groups the daemon is currently responsible for.
    WindowList:
      type: object
      required: [display, available, windows]
      properties:
        display: { type: string }
        available: { type: boolean }
        windows:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              desktop: { type: integer }
              class: { type: string }
              title: { type: string }
    Shutdown:
      type: object
      required: [ok, service]
      properties:
        ok: { type: boolean }
        service: { type: string }
    RenameRequest:
      type: object
      required: [from, to]
      properties:
        from: { type: string }
        to: { type: string }
    RenameResponse:
      type: object
      required: [from, to]
      properties:
        from: { type: string }
        to: { type: string }
    ScrollRequest:
      type: object
      required: [x, y, dx, dy]
      properties:
        x: { type: integer }
        y: { type: integer }
        dx: { type: integer }
        dy: { type: integer }
    DragRequest:
      type: object
      required: [x1, y1, x2, y2]
      properties:
        x1: { type: integer, minimum: 0, maximum: 1279 }
        y1: { type: integer, minimum: 0, maximum: 799 }
        x2: { type: integer, minimum: 0, maximum: 1279 }
        y2: { type: integer, minimum: 0, maximum: 799 }
        button: { type: integer, minimum: 1, maximum: 7, default: 1 }
    MoveRequest:
      type: object
      required: [x, y]
      properties:
        x: { type: integer, minimum: 0, maximum: 1279 }
        y: { type: integer, minimum: 0, maximum: 799 }
    CuaOk:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
    RecipeRequest:
      type: object
      required: [steps]
      properties:
        name: { type: string }
        stop_on_error: { type: boolean, default: true }
        screenshot: { type: string, enum: [none, end, each], default: end }
        record: { type: boolean, default: false }
        artifact_dir: { type: string }
        settle: { type: string, enum: [off, compressed, raw], default: off }
        observe:
          type: string
          enum: [off, input, page]
          default: off
          description: >-
            What the receipt reports about the desktop the steps ran against.
            off (the default) adds nothing to the receipt and costs nothing.
            input adds the window under each pointer step's target and the
            keyboard focus before each type/key, read over X11 on a connection
            the box already holds. page adds those plus the Chromium page URL
            either side of click, double_click, type and key. Neither changes
            ok, which still means only that no step returned an error.
        steps:
          type: array
          minItems: 1
          maxItems: 256
          items:
            type: object
            required: [op]
            properties:
              op:
                type: string
                enum: [click, double_click, double-click, move, drag, type, key, scroll, wait, screenshot, press, mousedown, release, mouseup, reset_desktop, reset]
    ObservedWindow:
      type: object
      required: [id]
      properties:
        id:
          type: string
          description: >-
            X window id in the same 0x… form wmctrl -lx and
            GET /v1/desktop/windows print, so the two can be matched up.
        class:
          type: string
          description: >-
            WM_CLASS as instance.class. Absent when no window in the ancestry
            claimed a class.
        title:
          type: string
          description: >-
            _NET_WM_NAME, falling back to WM_NAME. For a Chromium window this
            is the page title.
    StepObservation:
      type: object
      required: [observe_ms]
      description: >-
        What the box saw around one step. The block is present only when
        observe asked for it and the step had something to look at; its
        absence means the box did not look. A field missing inside a block
        that is present means the box looked and got no answer — never that
        nothing was there.
      properties:
        target:
          allOf: [{ $ref: "#/components/schemas/ObservedWindow" }]
          description: >-
            The window covering this step's target coordinate, read before the
            step moved anything. A taped click that now lands on a different
            window shows up as a class or title that changed between runs.
        focus:
          type: object
          required: [state]
          description: Where the keys were about to go. Read for type and key only.
          properties:
            state:
              type: string
              enum: [none, pointer_root, root, window]
              description: >-
                none means no window held the focus and the X server would have
                discarded the keystrokes: the type reached nothing at all. root
                means the window manager had parked focus on the root window,
                which on this desktop is also nowhere.
            window: { $ref: "#/components/schemas/ObservedWindow" }
        url_before:
          type: string
          description: >-
            The page Chromium was showing before the step. Absent when no page
            was visible at all, which is not the same as a blank address.
        url_after:
          type: string
          description: >-
            The page once the step and any settle wait returned. Read
            immediately, and a browser navigation is not instant, so a Return
            that did navigate often still shows the old URL here and the new
            one in the next step's url_before. A URL that never moves across a
            whole run is the signal that a Return submitted nothing.
        observe_ms:
          type: integer
          description: >-
            Wall time this step spent looking rather than acting. Not counted
            in the step's ms, the same way a per-step screenshot never was.
    RecipeResponse:
      type: object
      required: [ok, ran, duration_ms, steps]
      properties:
        ok:
          type: boolean
          description: >-
            No step returned an error. Not a claim that anything was achieved:
            a recipe whose taped coordinates have drifted onto another window
            plays every step without error. Read steps[].observed for what the
            box actually saw.
        name: { type: string }
        observe:
          type: string
          enum: [input, page]
          description: >-
            Echoed from the request, and absent when it was off. Without it a
            receipt carrying no observed blocks would be ambiguous: the box
            may have looked and seen nothing, or may never have been asked.
        ran: { type: integer }
        stopped_at: { type: integer, nullable: true }
        duration_ms: { type: integer }
        steps:
          type: array
          items:
            type: object
            required: [index, op, ok, ms]
            properties:
              index: { type: integer }
              op: { type: string }
              ok: { type: boolean }
              ms: { type: integer }
              error: { type: string }
              observed: { $ref: "#/components/schemas/StepObservation" }
        screenshot: { $ref: "#/components/schemas/Screenshot" }
    Info:
      type: object
      required: [box_id, service, protocol, version, capabilities, endpoints, workspace]
      properties:
        box_id: { type: string }
        service: { type: string }
        protocol: { type: string }
        version:
          type: object
          properties:
            box_host: { type: string }
            box_exec: { type: string }
            protocol: { type: string }
        capabilities:
          type: object
          properties:
            exec:
              type: object
              properties:
                enabled: { type: boolean }
                ready: { type: boolean }
            files:
              type: object
              properties:
                enabled: { type: boolean }
                ready: { type: boolean }
            desktop:
              type: object
              properties:
                enabled: { type: boolean }
                ready: { type: boolean }
            chrome:
              type: object
              properties:
                enabled: { type: boolean }
                ready: { type: boolean }
            cua:
              type: object
              properties:
                enabled: { type: boolean }
                ready: { type: boolean }
            egress_tunnel:
              type: object
              properties:
                enabled: { type: boolean }
                ready:
                  type: boolean
                  description: A laptop client is attached; CONNECT is relayed.
        endpoints:
          type: object
          properties:
            exec: { type: string }
            host: { type: string }
            scope: { type: string, examples: [container-local] }
        workspace: { type: string }

paths:
  /v1/health:
    get:
      tags: [exec, host]
      summary: Liveness
      description: Public probe. Body is only `{"status":"ok"}` (no service fingerprint).
      security: []
      responses:
        "200":
          description: Process is up
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /v1/ready:
    get:
      tags: [host]
      summary: Readiness (box-host only)
      description: 200 when box-exec /v1/health succeeds and the X display is up when BOX_DESKTOP_REQUIRED=1. Requires Bearer.
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Exec is reachable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ready" }
        "401":
          description: Missing or invalid bearer token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "503":
          description: Exec is down
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/info:
    get:
      tags: [host]
      summary: Box identity and capabilities (box-host only)
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Info
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Info" }
        "401":
          description: Missing or wrong token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/exec:
    post:
      tags: [exec]
      summary: Run a command (box-exec only)
      security: [{ bearer: [] }]
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExecRequest" }
      responses:
        "200":
          description: Command finished, timed out, or detached running receipt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExecResponse" }
        "400":
          description: Invalid request, PTY requested, or spawn failure
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Missing or wrong token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429":
          description: BOX_MAX_CONCURRENT_EXECS slots full
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/exec/{id}:
    get:
      tags: [exec]
      summary: Poll a detached exec (in-memory; not durable)
      security: [{ bearer: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Detached job snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExecResponse" }
        "404":
          description: Unknown exec id
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    delete:
      tags: [exec]
      summary: Cancel a running exec and its whole process group
      description: >-
        Sends SIGTERM to the exec's process group, then SIGKILL after
        BOX_EXEC_KILL_GRACE_MS. Works for detached execs and for in-flight ones.
      security: [{ bearer: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Signalled, or the id was known but already finished
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExecCancelResponse" }
        "404":
          description: Unknown exec id
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/files:
    get:
      tags: [exec]
      summary: Read a file or list a directory (box-exec only)
      security: [{ bearer: [] }]
      parameters:
        - in: query
          name: path
          schema: { type: string }
          description: Workspace-relative or jailed absolute path
        - in: query
          name: encoding
          schema: { type: string, enum: [utf8, text, base64] }
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: File or directory
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FileGet" }
        "400":
          description: Path escape or bad encoding
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Missing or wrong token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    put:
      tags: [exec]
      summary: Write a file (box-exec only)
      security: [{ bearer: [] }]
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FilePutRequest" }
      responses:
        "200":
          description: Written
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FilePutResponse" }
        "400":
          description: Path escape or invalid body
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Missing or wrong token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "413":
          description: Payload too large
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    delete:
      tags: [exec]
      summary: Delete a file or directory (box-exec only)
      security: [{ bearer: [] }]
      parameters:
        - in: query
          name: path
          required: true
          schema: { type: string }
        - in: query
          name: recursive
          schema: { type: string, enum: ["true", "1"] }
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FileDeleteResponse" }
        "400":
          description: Path escape, empty path, or non-empty directory
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Missing or wrong token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/files/mkdir:
    post:
      tags: [exec]
      summary: Create a directory (box-exec only)
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MkdirRequest" }
      responses:
        "200":
          description: Created or already present
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MkdirResponse" }
        "400":
          description: Path escape or path is a file
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Missing or wrong token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/desktop:
    get:
      tags: [desktop, host]
      summary: Virtual desktop status (box-host)
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Display probe and noVNC viewer URL
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DesktopStatus" }
        "401":
          description: Missing or wrong token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/chrome:
    get:
      tags: [desktop, host]
      summary: Chromium status (box-host)
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Profile path, CDP bind, running flag
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChromeStatus" }
        "401":
          description: Missing or wrong token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/egress:
    get:
      tags: [host]
      summary: Egress tunnel status (box-host)
      description: |
        Laptop CONNECT tunnel. enabled follows BOX_EGRESS_TUNNEL. ready /
        client_attached mean a box-egress-tunnel client is attached.
        Fail-closed CONNECT while enabled but not ready. ws/proxy are
        container-local listens, not SDK connect URLs.
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Tunnel inventory and client-attached flag
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EgressStatus" }
        "401":
          description: Missing or wrong token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/cua/screenshot:
    post:
      tags: [cua]
      summary: Capture the 1280x800 X framebuffer as PNG
      security: [{ bearer: [] }]
      parameters:
        - in: query
          name: format
          schema: { type: string, enum: [json, png] }
      responses:
        "200":
          description: PNG screenshot as JSON metadata or raw image/png
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Screenshot" }
            image/png:
              schema: { type: string, format: binary }
        "401":
          description: Missing or wrong token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "503":
          description: CUA disabled or display down
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/cua/click:
    post:
      tags: [cua]
      summary: Click at framebuffer coordinates
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClickRequest" }
      responses:
        "200":
          description: Clicked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CuaOk" }
        "400":
          description: Out of range or invalid button
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Missing or wrong token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/cua/double-click:
    post:
      tags: [cua]
      summary: Double-click at framebuffer coordinates
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClickRequest" }
      responses:
        "200":
          description: Double-clicked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CuaOk" }
        "400":
          description: Out of range or invalid button
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Missing or wrong token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/cua/move:
    post:
      tags: [cua]
      summary: Move the pointer without clicking
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MoveRequest" }
      responses:
        "200":
          description: Moved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CuaOk" }
        "400":
          description: Out of range
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Missing or wrong token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/cua/drag:
    post:
      tags: [cua]
      summary: Drag from one framebuffer point to another
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DragRequest" }
      responses:
        "200":
          description: Dragged
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CuaOk" }
        "400":
          description: Out of range or invalid button
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Missing or wrong token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/cua/type:
    post:
      tags: [cua]
      summary: Type text into the focused window
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TypeRequest" }
      responses:
        "200":
          description: Typed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CuaOk" }
        "400":
          description: Empty or oversized text
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Missing or wrong token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/cua/key:
    post:
      tags: [cua]
      summary: Press an xdotool keysym
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KeyRequest" }
      responses:
        "200":
          description: Key sent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CuaOk" }
        "400":
          description: Invalid key
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Missing or wrong token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/cua/scroll:
    post:
      tags: [cua]
      summary: Scroll at framebuffer coordinates
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScrollRequest" }
      responses:
        "200":
          description: Scrolled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CuaOk" }
        "400":
          description: Out of range or dx=dy=0
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Missing or wrong token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/cua/recipe:
    post:
      tags: [cua]
      summary: Run many CUA steps in one request
      description: |
        Lint the whole plan, then actuate sequentially against DISPLAY=:1.
        This is grok-box's recipe layer (one tool call, many pointer ops).
        It is not a reverse-web-mcp compiler: the caller already wrote the steps.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecipeRequest" }
      responses:
        "200":
          description: Receipt (ok may be false if a step failed)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecipeResponse" }
        "400":
          description: Empty plan, too many steps, or out of range — nothing ran
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Missing or wrong token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "503":
          description: CUA disabled or display down
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/exec/stream:
    post:
      tags: [exec]
      summary: Stream exec stdout/stderr/exit as NDJSON (or SSE)
      description: |
        Same admission and timeout as POST /v1/exec. Default body is
        application/x-ndjson lines. Send Accept: text/event-stream for SSE.
        PTY is not implemented.
      security: [{ bearer: [] }]
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExecRequest" }
      responses:
        "200":
          description: Stream of stdout/stderr then an exit event
          content:
            application/x-ndjson:
              schema: { $ref: "#/components/schemas/ExecStreamEvent" }
            text/event-stream:
              schema: { type: string }
        "401":
          description: Missing or wrong token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429":
          description: Busy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/files/raw:
    get:
      tags: [exec]
      summary: Read a file as application/octet-stream
      security: [{ bearer: [] }]
      parameters:
        - in: query
          name: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Raw bytes
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "400":
          description: Path escape or directory
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Missing or wrong token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    put:
      tags: [exec]
      summary: Write a file from an octet-stream body
      security: [{ bearer: [] }]
      parameters:
        - in: query
          name: path
          required: true
          schema: { type: string }
        - in: query
          name: create_dirs
          schema: { type: string }
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: Written
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FilePutResponse" }

  /v1/files/rename:
    post:
      tags: [exec]
      summary: Rename a file or directory (box-exec only)
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RenameRequest" }
      responses:
        "200":
          description: Renamed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RenameResponse" }
        "400":
          description: Path escape or destination exists
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Missing or wrong token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Source not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/busy:
    get:
      tags: [exec, host]
      summary: Exec slots (box-exec) or readiness flags (box-host)
      security: [{ bearer: [] }]
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Busy snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Busy" }
        "401":
          description: Missing or wrong token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/shutdown:
    post:
      tags: [exec, host]
      summary: Graceful process shutdown after the response is sent
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Shutdown scheduled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Shutdown" }

  /v1/metrics:
    get:
      tags: [exec, host]
      summary: Lightweight process metrics (not Prometheus)
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Counters
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Metrics" }

  /v1/desktop/windows:
    get:
      tags: [desktop, host]
      summary: wmctrl window list for the guest display
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Windows
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WindowList" }
        "401":
          description: Missing or wrong token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/cua/press:
    post:
      tags: [cua]
      summary: mousemove + mousedown (no mouseup)
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PressRequest" }
      responses:
        "200":
          description: Pressed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CuaOk" }
        "400":
          description: Out of range
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Missing or wrong token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/cua/mousedown:
    post:
      tags: [cua]
      summary: Alias for /v1/cua/press
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PressRequest" }
      responses:
        "200":
          description: Pressed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CuaOk" }

  /v1/cua/release:
    post:
      tags: [cua]
      summary: Optional motion path then mouseup
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReleaseRequest" }
      responses:
        "200":
          description: Released
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CuaOk" }
        "400":
          description: Out of range or x/y mismatch
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Missing or wrong token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/cua/mouseup:
    post:
      tags: [cua]
      summary: Alias for /v1/cua/release
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReleaseRequest" }
      responses:
        "200":
          description: Released
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CuaOk" }
