openapi: 3.1.0
info:
  title: grok-box
  description: |
    Layer 3 sandboxed agent computer. Two processes share this document:
    box-exec (port 1337: exec, files, CUA) and box-host (port 1340: identity,
    readiness, desktop/chrome status). Neither service performs model inference.
    CUA coordinate space is the X framebuffer 1280x800.
  version: 0.1.0
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://127.0.0.1:1337
    description: box-exec (Compose)
  - url: http://127.0.0.1:1340
    description: box-host (Compose)

tags:
  - name: exec
    description: box-exec — commands and workspace files
  - name: cua
    description: box-exec — Computer Use against DISPLAY=:1 (1280x800)
  - name: host
    description: box-host — identity and readiness
  - name: desktop
    description: box-host — virtual desktop and Chromium status

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, status]
          properties:
            code: { type: string, examples: [unauthorized, path_escape] }
            message: { type: string }
            status: { type: integer }
    Health:
      type: object
      required: [status, service, version]
      properties:
        status: { type: string, examples: [ok] }
        service: { type: string }
        version: { type: string }
    ExecRequest:
      type: object
      required: [command]
      properties:
        command:
          oneOf:
            - type: array
              items: { type: string }
              minItems: 1
            - type: string
              minLength: 1
        cwd: { type: string, description: Relative or absolute path inside the workspace jail }
        timeout_ms: { type: integer, minimum: 1 }
        env:
          type: object
          additionalProperties: { type: string }
        stdin: { type: string, nullable: true }
    ExecResponse:
      type: object
      required: [stdout, stderr, timed_out, duration_ms, truncated, cwd]
      properties:
        stdout: { type: string }
        stderr: { type: string }
        exit_code: { type: integer, nullable: true }
        timed_out: { type: boolean }
        duration_ms: { type: integer }
        truncated: { type: boolean }
        cwd: { type: string }
    FileGet:
      oneOf:
        - type: object
          required: [kind, path, size, encoding, content]
          properties:
            kind: { type: string, enum: [file] }
            path: { type: string }
            size: { type: integer }
            encoding: { type: string, enum: [utf8, base64] }
            content: { type: string }
        - type: object
          required: [kind, path, entries]
          properties:
            kind: { type: string, enum: [directory] }
            path: { type: string }
            entries:
              type: array
              items:
                type: object
                required: [name, kind]
                properties:
                  name: { type: string }
                  kind: { type: string }
                  size: { type: integer, nullable: true }
    FilePutRequest:
      type: object
      required: [path, content]
      properties:
        path: { type: string }
        content: { type: string }
        encoding: { type: string, enum: [utf8, text, base64], default: utf8 }
        create_dirs: { type: boolean, default: true }
    FilePutResponse:
      type: object
      required: [path, bytes_written]
      properties:
        path: { type: string }
        bytes_written: { type: integer }
    Ready:
      type: object
      required: [status, service, exec_ready, desktop_ready]
      properties:
        status: { type: string }
        service: { type: string }
        exec_ready: { type: boolean }
        desktop_ready: { type: boolean }
    DesktopStatus:
      type: object
      required: [available, display, geometry, vnc, viewer]
      properties:
        available: { type: boolean }
        display: { type: string }
        geometry: { type: string }
        vnc: { type: string }
        viewer:
          type: object
          properties:
            port: { type: integer }
            path: { type: string }
            url: { type: string }
    ChromeStatus:
      type: object
      required: [enabled, running, profile, display]
      properties:
        enabled: { type: boolean }
        running: { type: boolean }
        profile: { type: string }
        cdp: { type: string, nullable: true }
        display: { type: string }
    Screenshot:
      type: object
      required: [encoding, mime, width, height, png_base64, bytes]
      properties:
        encoding: { type: string, examples: [base64] }
        mime: { type: string, examples: [image/png] }
        width: { type: integer, examples: [1280] }
        height: { type: integer, examples: [800] }
        bytes: { type: integer }
        png_base64: { type: string }
    ClickRequest:
      type: object
      required: [x, y]
      properties:
        x: { type: integer, minimum: 0, maximum: 1279 }
        y: { type: integer, minimum: 0, maximum: 799 }
        button: { type: integer, minimum: 1, maximum: 7, default: 1 }
    TypeRequest:
      type: object
      required: [text]
      properties:
        text: { type: string, minLength: 1 }
    KeyRequest:
      type: object
      required: [key]
      properties:
        key: { type: string, minLength: 1 }
    ScrollRequest:
      type: object
      required: [x, y, dx, dy]
      properties:
        x: { type: integer }
        y: { type: integer }
        dx: { type: integer }
        dy: { type: integer }
    CuaOk:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
    Info:
      type: object
      required: [box_id, service, protocol, version, capabilities, endpoints, workspace]
      properties:
        box_id: { type: string }
        service: { type: string }
        protocol: { type: string }
        version:
          type: object
          properties:
            box_host: { type: string }
            box_exec: { type: string }
            protocol: { type: string }
        capabilities:
          type: object
          properties:
            exec: { type: boolean }
            files: { type: boolean }
            desktop: { type: boolean }
            chrome: { type: boolean }
            cua: { type: boolean }
        endpoints:
          type: object
          properties:
            exec: { type: string }
            host: { type: string }
        workspace: { type: string }

paths:
  /v1/health:
    get:
      tags: [exec, host]
      summary: Liveness
      security: []
      responses:
        "200":
          description: Process is up
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /v1/ready:
    get:
      tags: [host]
      summary: Readiness (box-host only)
      description: 200 when box-exec /v1/health succeeds and the X display is up when BOX_DESKTOP_REQUIRED=1.
      security: []
      responses:
        "200":
          description: Exec is reachable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ready" }
        "503":
          description: Exec is down
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/info:
    get:
      tags: [host]
      summary: Box identity and capabilities (box-host only)
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Info
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Info" }
        "401":
          description: Missing or wrong token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/exec:
    post:
      tags: [exec]
      summary: Run a command (box-exec only)
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExecRequest" }
      responses:
        "200":
          description: Command finished or timed out
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExecResponse" }
        "400":
          description: Invalid request or spawn failure
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Missing or wrong token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/files:
    get:
      tags: [exec]
      summary: Read a file or list a directory (box-exec only)
      security: [{ bearer: [] }]
      parameters:
        - in: query
          name: path
          schema: { type: string }
          description: Workspace-relative or jailed absolute path
        - in: query
          name: encoding
          schema: { type: string, enum: [utf8, text, base64] }
      responses:
        "200":
          description: File or directory
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FileGet" }
        "400":
          description: Path escape or bad encoding
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Missing or wrong token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    put:
      tags: [exec]
      summary: Write a file (box-exec only)
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FilePutRequest" }
      responses:
        "200":
          description: Written
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FilePutResponse" }
        "400":
          description: Path escape or invalid body
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Missing or wrong token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "413":
          description: Payload too large
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/desktop:
    get:
      tags: [desktop, host]
      summary: Virtual desktop status (box-host)
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Display probe and noVNC viewer URL
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DesktopStatus" }
        "401":
          description: Missing or wrong token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/chrome:
    get:
      tags: [desktop, host]
      summary: Chromium status (box-host)
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Profile path, CDP bind, running flag
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChromeStatus" }
        "401":
          description: Missing or wrong token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/cua/screenshot:
    post:
      tags: [cua]
      summary: Capture the 1280x800 X framebuffer as PNG (base64 JSON)
      security: [{ bearer: [] }]
      responses:
        "200":
          description: PNG screenshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Screenshot" }
        "401":
          description: Missing or wrong token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "503":
          description: CUA disabled or display down
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/cua/click:
    post:
      tags: [cua]
      summary: Click at framebuffer coordinates
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClickRequest" }
      responses:
        "200":
          description: Clicked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CuaOk" }
        "400":
          description: Out of range or invalid button
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Missing or wrong token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/cua/type:
    post:
      tags: [cua]
      summary: Type text into the focused window
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TypeRequest" }
      responses:
        "200":
          description: Typed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CuaOk" }
        "400":
          description: Empty or oversized text
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Missing or wrong token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/cua/key:
    post:
      tags: [cua]
      summary: Press an xdotool keysym
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KeyRequest" }
      responses:
        "200":
          description: Key sent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CuaOk" }
        "400":
          description: Invalid key
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Missing or wrong token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/cua/scroll:
    post:
      tags: [cua]
      summary: Scroll at framebuffer coordinates
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScrollRequest" }
      responses:
        "200":
          description: Scrolled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CuaOk" }
        "400":
          description: Out of range or dx=dy=0
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Missing or wrong token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
